            - generic [ref=e80]:
              - paragraph [ref=e81]:
                - text: 这两天，一个叫
                - code [ref=e82]: mattpocock/skills
                - text: 的仓库在
                - link "GitHub Trending" [ref=e84] [cursor=pointer]:
                  - /url: https://zhida.zhihu.com/search?content_id=273943620&content_type=Article&match_order=1&q=GitHub+Trending&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3Nzc3MDc3MjksInEiOiJHaXRIdWIgVHJlbmRpbmciLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNzM5NDM2MjAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.jzWTtlNK4eNebgrGKLPgjT5R7PXM63igoa-89IVuhIs&zhida_source=entity
                  - text: GitHub Trending
                  - img [ref=e85]
                - text: 榜上突然爆发——短短一天内新增超过 5600 颗 Star，总 Star 数突破 3 万，成功登顶。
              - paragraph [ref=e87]:
                - text: 这个仓库的作者叫 Matt Pocock，一个 TypeScript 课程作者，最近一年多在教开发者如何真正用好 AI 编程。他最近在
                - link "AI Engineer" [ref=e89] [cursor=pointer]:
                  - /url: https://zhida.zhihu.com/search?content_id=273943620&content_type=Article&match_order=1&q=AI+Engineer&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3Nzc3MDc3MjksInEiOiJBSSBFbmdpbmVlciIsInpoaWRhX3NvdXJjZSI6ImVudGl0eSIsImNvbnRlbnRfaWQiOjI3Mzk0MzYyMCwiY29udGVudF90eXBlIjoiQXJ0aWNsZSIsIm1hdGNoX29yZGVyIjoxLCJ6ZF90b2tlbiI6bnVsbH0.hkRQ2G4ymmAzvxm_C7iAOTQXT-_iGSNgAUmNpjd5TOs&zhida_source=entity
                  - text: AI Engineer
                  - img [ref=e90]
                - text: 上的演讲被放了出来，反响不错。应该是这个演讲让他的 skills 翻红。
              - paragraph [ref=e92]: 今天这篇文章，不仅仅是介绍他的 skills，主要是介绍这些 skills 产生的思路。
              - separator [ref=e93]
              - paragraph [ref=e94]: Matt Pocock 认为：
              - paragraph [ref=e95]:
                - strong [ref=e96]: 软件工程基本功在 AI 时代比以往任何时候都更重要。
              - paragraph [ref=e97]: 绝大多数关于 AI 编程的叙事走向是"代码不再重要"、"会提问就够了"、"程序员要失业了"。Matt 的观点完全相反。
              - paragraph [ref=e98]:
                - text: 他花了 18 个月教开发者用 AI 智能体构建应用，观察到一个持续出现的规律：
                - strong [ref=e99]: 那些用 AI 成功的开发者，不是把什么都委托出去的人，也不是什么都自己做的人。他们是在 AI 遇到困难时能回归工程基本功的人。
              - paragraph [ref=e100]: 他问了自己一个问题：为什么同样用 AI，有的人越用越好，有的人越用越乱？
              - paragraph [ref=e101]: 答案指向了代码本身。好的代码库让 AI 表现出色。差的代码库让 AI 一塌糊涂。"坏代码是有史以来最贵的"——因为它让你无法利用 AI 能带来的一切红利。
              - paragraph [ref=e102]: 他还反对"specs to code"范式——用规格说明书生成代码，代码出问题时改说明书而不是改代码，把代码当成黑盒编译产物。
              - paragraph [ref=e103]: 他试过。结果是：第一次编译出来的代码还行，第二次变差，第三次更差，越跑越烂，最后一堆垃圾。
              - paragraph [ref=e104]:
                - text: 他的诊断是：这和" vibe coding "换了个名字没有本质区别——两者都在
                - strong [ref=e105]: 放弃对代码的所有权
                - text: 。而代码是你的战场，你必须掌控它，理解它，塑造它。
              - paragraph [ref=e106]: 这是他整个方法论的出发点。
              - separator [ref=e107]
              - heading "六个失败模式，六个解法" [level=2] [ref=e108]
              - paragraph [ref=e109]: Matt 把 AI 编程中常见的问题归纳为六个失败模式，他的 Skills 仓库里的每一个工具，基本上都对应其中一个，很多论据则来自软件工程领域的一些书籍和概念。
              - heading "失败模式一：AI 没做我想要的" [level=4] [ref=e110]
              - paragraph [ref=e111]: 这是最普遍的问题。你脑子里有个想法，AI 做出来的是另一回事。
              - paragraph [ref=e112]:
                - text: Matt Pocock 从
                - link "Frederick P. Brooks" [ref=e114] [cursor=pointer]:
                  - /url: https://zhida.zhihu.com/search?content_id=273943620&content_type=Article&match_order=1&q=Frederick+P.+Brooks&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3Nzc3MDc3MjksInEiOiJGcmVkZXJpY2sgUC4gQnJvb2tzIiwiemhpZGFfc291cmNlIjoiZW50aXR5IiwiY29udGVudF9pZCI6MjczOTQzNjIwLCJjb250ZW50X3R5cGUiOiJBcnRpY2xlIiwibWF0Y2hfb3JkZXIiOjEsInpkX3Rva2VuIjpudWxsfQ.PakSuGuwE0U5e4yfzGB96D2MagTuSDcyE1gRP8ui8Jk&zhida_source=entity
                  - text: Frederick P. Brooks
                  - img [ref=e115]
                - text: 的《设计的设计》里找到了诊断词：
                - strong [ref=e117]: 设计概念（Design Concept）
                - text: 。当多个人协同设计某个东西时，他们之间漂浮着一个无形的共同理解，对将要构建的东西的构想，即设计概念。
              - paragraph [ref=e118]: 你和 AI 之间缺的就是这个。
              - paragraph [ref=e119]:
                - text: 他的解法是
                - code [ref=e120]: grill-me
                - text: 技能，全文只有几行：
              - blockquote [ref=e121]:
                - paragraph [ref=e122]: 以无情审问的方式采访我，直到我们达成共识。逐一追究设计树的每个分支，一个一个地解决依赖关系。对每个问题提供你的推荐答案。每次只问一个问题。
              - paragraph [ref=e123]: 这几行字意味着 AI 会问你大概 40 个问题、60 个问题。这个 skill 把 AI 变成了一种对手，它不断地向你抛出想法，试图达成共识。
              - paragraph [ref=e124]:
                - text: 这个技能应该是他最出圈的 skill，他认为这比 Claude Code 默认的 plan 模式要好。 plan 模式急于创建一个资产，它非常想直接创建一个计划然后开始干活，
                - code [ref=e125]: grill-me
                - text: 则先明确设计感念。
              - heading "失败模式二：AI 太啰嗦，鸡同鸭讲" [level=4] [ref=e126]
              - paragraph [ref=e127]: AI 太啰嗦了，并且总是到不了点子上，它会试图通过说大量的话来试图表达它在做什么。
              - paragraph [ref=e128]: 这里面的问题可能在于，你和 AI 没有在同一个话语体系里。
              - paragraph [ref=e129]:
                - text: Matt Pocock 从领域驱动设计（DDD）里拿了一个概念：
                - strong [ref=e130]: 通用语言（Ubiquitous Language）
                - text: 。开发者之间的对话、代码里的命名、和领域专家的交流，都来自同一个领域模型。
              - paragraph [ref=e131]:
                - text: 他做了一个
                - code [ref=e132]: ubiquitous-language
                - text: 技能，扫描你的代码库，提取所有术语，生成一个 Markdown 表格。然后在每次和 AI 规划时把这个文件带进去。
              - paragraph [ref=e133]: 他观察 AI 的思维链后发现：通用语言不仅改善了规划质量，还让 AI 的实现更贴近你的设想，因为它在用和你完全一致的词汇思考。
              - heading "失败模式三：AI 做了正确的事，但代码不工作" [level=4] [ref=e134]
              - paragraph [ref=e135]: 当前两步都搞定，概念和术语都对齐了，AI 也确实干活了，但是输出不 work，怎么办 ？
              - paragraph [ref=e136]: Matt Pocock 说通过反馈循环，可以显著改善这个问题。
              - paragraph [ref=e137]: 没有类型检查、没有测试、没有静态分析，AI 就是在黑暗中编程。
              - paragraph [ref=e138]:
                - text: 但问题不只是"加上测试"这么简单。AI 的默认行为是
                - strong [ref=e139]: 先写完所有实现，然后想到要测试了才测试
                - text: ，AI 总是倾向于一次做太多，产出大量代码。
              - paragraph [ref=e140]:
                - link "《程序员修炼之道》" [ref=e142] [cursor=pointer]:
                  - /url: https://zhida.zhihu.com/search?content_id=273943620&content_type=Article&match_order=1&q=%E3%80%8A%E7%A8%8B%E5%BA%8F%E5%91%98%E4%BF%AE%E7%82%BC%E4%B9%8B%E9%81%93%E3%80%8B&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3Nzc3MDc3MjksInEiOiLjgIrnqIvluo_lkZjkv67ngrzkuYvpgZPjgIsiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNzM5NDM2MjAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.naGT-eP4HM5_VYfWZogNECyXWbbeVdg3mTS7h1fEcQU&zhida_source=entity
                  - text: 《程序员修炼之道》
                  - img [ref=e143]
                - text: 管这个叫，"跑在前灯前面"——开车开太快，灯光照不到那么远，你就看不到前面的路。
              - paragraph [ref=e145]:
                - strong [ref=e146]: 反馈速度是你的速度上限。
              - paragraph [ref=e147]:
                - text: 他的解法是
                - code [ref=e148]: tdd
                - text: （测试驱动开发）技能，强制 LLM 真正采取小步骤，强制 AI 走红-绿-重构的循环：先写一个失败的测试，然后让实现通过，然后重构。AI 很难在这个模式下作弊，因为它必须在代码存在之前就把测试写好。
              - paragraph
              - figure [ref=e149]:
                - img [ref=e151]
              - paragraph
              - heading "失败模式四：代码库太混乱，AI 越改越烂" [level=4] [ref=e152]
              - paragraph [ref=e153]: 好的代码库就是容易测试的代码库。
              - paragraph [ref=e154]:
                - text: 这里 Matt 引用了
                - link "John Ousterhout" [ref=e156] [cursor=pointer]:
                  - /url: https://zhida.zhihu.com/search?content_id=273943620&content_type=Article&match_order=1&q=John+Ousterhout&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3Nzc3MDc3MjksInEiOiJKb2huIE91c3RlcmhvdXQiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNzM5NDM2MjAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.mKgIbtg0BDKnCJCjRot-27WyDTsLfwZdQCUJm4djG9U&zhida_source=entity
                  - text: John Ousterhout
                  - img [ref=e157]
                - text: 《软件设计哲学》里的核心概念：
                - strong [ref=e159]: 深模块（Deep Module）vs 浅模块（Shallow Module）
                - text: 。
              - paragraph [ref=e160]: 浅模块：接口复杂，功能少，大量小文件相互依赖——AI 需要手动追踪整个依赖图，很快迷失，产生的代码越来越乱。
              - paragraph [ref=e161]: 深模块：接口简单，内部封装大量功能——AI 只需要理解接口，不需要钻进每个细节。这样的代码库也更容易测试：你在模块外部建一个测试边界，从接口层面验证行为。
              - paragraph
              - figure [ref=e162]:
                - img [ref=e164]
              - paragraph
              - paragraph [ref=e165]:
                - text: 他的
                - code [ref=e166]: improve-codebase-architecture
                - text: 技能会扫描你的代码库，找出可以合并为深模块的代码群，提出重构建议。他自己的例子：把一个浏览器端视频编辑器的前端到后端的完整流程包进一个大模块，从外部统一测试。AI 在这个代码库里的表现是"翻天覆地的改变"。
              - heading "失败模式五：大脑跟不上" [level=4] [ref=e167]
              - paragraph [ref=e168]: 你比以前交付了更多代码，但也比以前更累了。你对代码库的理解越来越模糊。
              - paragraph [ref=e169]:
                - text: 深模块提供了一个思维上的解法：把这些模块当成
                - strong [ref=e170]: 灰箱
                - text: ——你设计接口，你验证行为，但内部实现可以委托给 AI 处理，你不需要审查每一行。
              - paragraph [ref=e171]: Matt 的建议：设计接口，委托实现（Design the interface, delegate the implementation）。这来自 Kent Beck 的话："每天投资于系统的设计。"
              - paragraph [ref=e172]:
                - text: 这也是他反对"specs to code"最本质的理由：specs to code 是在
                - strong [ref=e173]: 撤资
                - text: 系统设计，而你应该持续投资。
              - heading "失败模式六：大任务让 AI 进入愚蠢区" [level=4] [ref=e174]
              - paragraph [ref=e175]:
                - text: 他有个 LLM 的基本认知模型：
                - strong [ref=e176]: 智慧区和愚蠢区
                - text: 。每个对话从零开始，在上下文大约 100k tokens 之前，LLM 工作良好。超过这个范围，注意力机制的压力呈平方级增长，LLM 开始变笨。
              - paragraph [ref=e177]:
                - text: 大任务不能在一个上下文里完成，但顺序多阶段计划也只能被一个智能体线性执行。他的解法是把大任务变成一张
                - strong [ref=e178]: 有向无环图（DAG）的看板
                - text: ，任务之间有阻塞关系，没有阻塞关系的任务可以被多个智能体并行领取。
              - separator [ref=e179]
              - heading "它们怎么连成一个工作流" [level=2] [ref=e180]
              - paragraph [ref=e181]: 这些技能不是孤立工具，它们构成了一套完整的工作流：
              - code [ref=e184]: 想法 ↓ /grill-me [客户需求文档] -- 与 AI 建立共同的设计概念 ↓ /to-prd -- 将对话转化为目的地文档 ↓ /to-issues -- 切分为垂直曳光弹 Issue（看板） ↓ ralph-once.sh / ralph-loop.sh -- AFK 智能体逐 Issue 实现（TDD） ↓ 人工 QA + 代码审查 -- 把品味和判断注回代码 ↓ 回到看板 -- QA 产生新 Issue，循环继续
              - paragraph [ref=e185]: 几个关键细节：
              - paragraph [ref=e186]:
                - strong [ref=e187]: 垂直切片而非水平切片
                - text: 。AI 的本能是先建好所有数据库层，再建 API 层，再建前端——这意味着你要等到第三阶段才能获得任何真实反馈。正确的方式是垂直切片：第一个 Issue 就应该包含 schema 变更 + 服务创建 + 最小前端呈现，一个完整的薄片穿透所有层。这就是《程序员修炼之道》里的曳光弹：不是看不见的普通子弹，而是发光的曳光弹，让你立刻知道你打到哪了。
              - paragraph [ref=e188]:
                - strong [ref=e189]: 不要压缩，要清除
                - text: 。Context 用满时有两个选项：压缩（把对话历史精简成摘要继续）或清除（回到零）。他选择清除，每次都从一个稳定的起点开始，而不是在沉积的上下文里越走越偏。
              - paragraph [ref=e190]:
                - strong [ref=e191]: 人类做两件事，智能体做一件事
                - text: 。规划（grill-me 到 PRD 到 Issue）是人在环路的，必须是。实现是 AFK 的，可以完全交出去。QA 是人在环路的，必须是——这是你将品味和判断注回代码的唯一窗口。
              - paragraph [ref=e192]:
                - strong [ref=e193]: 并行化
                - text: 。他还做了一个叫 Sand Castle 的 TypeScript 库：一个 Planner 智能体分析 Issue 依赖图，对可并行的 Issue 各创建一个 Docker 沙箱，多个 Implementer 智能体同时运行，完成后 Merger 智能体负责合并并解决冲突。Reviewer 使用 Opus，Implementer 使用 Sonnet，审查在清空的上下文里运行，处于完整的智慧区。
              - separator [ref=e194]
              - paragraph [ref=e195]: Matt 在演讲中引用并推荐了这些书单：
              - list [ref=e196]:
                - listitem [ref=e197]:
                  - text: •
                  - paragraph [ref=e198]: 《软件设计哲学》- John Ousterhout（深模块）
                - listitem [ref=e199]:
                  - text: •
                  - paragraph [ref=e200]: 《程序员修炼之道》- Hunt & Thomas（曳光弹、软件熵、超越车灯）
                - listitem [ref=e201]:
                  - text: •
                  - paragraph [ref=e202]: 《设计的设计》- Frederick P. Brooks（设计概念）
                - listitem [ref=e203]:
                  - text: •
                  - paragraph [ref=e204]:
                    - link "《领域驱动设计》" [ref=e206] [cursor=pointer]:
                      - /url: https://zhida.zhihu.com/search?content_id=273943620&content_type=Article&match_order=1&q=%E3%80%8A%E9%A2%86%E5%9F%9F%E9%A9%B1%E5%8A%A8%E8%AE%BE%E8%AE%A1%E3%80%8B&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3Nzc3MDc3MjksInEiOiLjgIrpoobln5_pqbHliqjorr7orqHjgIsiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNzM5NDM2MjAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.strERqHuwvM3kqhVhZzDFsp3vovmpAERoOSPeuauL5o&zhida_source=entity
                      - text: 《领域驱动设计》
                      - img [ref=e207]
                    - text: "- Eric Evans（通用语言）"
              - paragraph [ref=e209]:
                - text: 这些书写于 AI 编程存在之前，有的写于二三十年前。他的论点是：这些书里的原则在 AI 时代不是过时了，而是
                - strong [ref=e210]: 被放大了
                - text: 。
              - paragraph [ref=e211]: AI 在好代码库里的表现是指数级更好的，这意味着好代码的价值也是指数级放大的。软件熵在 AI 时代的扩散速度比人类写代码时快得多——一个差的代码库加上 AI 会更快地变成无法维护的泥潭。
              - paragraph [ref=e212]: 他的 Skills 仓库本质上是一个接口——把这些几十年前的工程智慧封装成可以被 AI 智能体调用的提示词原语。让你不需要每次都去翻书，让 AI 也能理解和遵循这些原则。
              - paragraph [ref=e213]:
                - code [ref=e214]: mattpocock/skills
                - text: 登顶 GitHub Trending，也许只是因为它恰好击中了一个开发者集体焦虑的时刻：不知道如何和 AI 协作才是对的，不知道自己的工程经验还算不算数。
              - paragraph [ref=e215]: Matt 的答案是：算数，比以前更算数。
